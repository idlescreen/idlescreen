[package]
name = "idlescreen-extras"
version = "4.1.31"
edition = "2024"
license = "Apache-2.0"
authors = ["idlescreen developers"]
description = "Mathematical screensaver collection helper for IdleScreen"
repository = "https://github.com/idlescreen/idlescreen"
default-run = "idlescreen-extras"

[[bin]]
name = "idlescreen-extras"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[lints.rust]
unused_must_use = "warn"
unsafe_op_in_unsafe_fn = "warn"
dead_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
semicolon_if_nothing_returned = "allow"
float_cmp = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
unreadable_literal = "allow"
similar_names = "allow"
many_single_char_names = "allow"
needless_range_loop = "allow"
manual_let_else = "allow"
needless_pass_by_value = "allow"
match_wildcard_for_single_variants = "allow"
match_same_arms = "allow"
comparison_chain = "allow"
return_self_not_must_use = "allow"
unnecessary_wraps = "allow"
assigning_clones = "allow"

[package.metadata.deb]
name = "idlescreen-extras"
maintainer = "IdleScreen <team@idlescreen.org>"
copyright = "2026 IdleScreen"
section = "utils"
priority = "optional"
depends = "libc6, idlescreen (= 4.1.16)"
extended-description = "Optional mathematical screensaver collection helper for IdleScreen"
assets = [
    ["../../target/release/idlescreen-extras", "usr/libexec/idlescreen/idlescreen-extras", "755"],
]

[package.metadata.generate-rpm]
name = "idlescreen-extras"
release = "1"
arch = "x86_64"
summary = "Optional mathematical screensaver collection helper for IdleScreen"
description = "Consolidated multi-call helper providing 11 mathematical screensavers"
license = "Apache-2.0"
assets = [
    { source = "../../target/release/idlescreen-extras", dest = "/usr/libexec/idlescreen/idlescreen-extras", mode = "755" },
]
[package.metadata.generate-rpm.requires]
idlescreen = "= 4.1.16"


