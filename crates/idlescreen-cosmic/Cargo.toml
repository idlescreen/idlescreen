[package]
authors = ["idlescreen developers"]
name = "idle-applet"
version = "4.4.0"
edition = "2024"
license = "Apache-2.0"
description = "IdleScreen for COSMIC — product package (applet + pulls daemon)"
repository = "https://github.com/idlescreen/idlescreen"
publish = false

[[bin]]
name = "idlescreen-applet"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[dependencies.libcosmic]
# Pinned to a commit SHA (not a tag/branch) for reproducible builds; see
# LIBCOSMIC_PIN.md for the rationale, risks, and bump procedure.
git = "https://github.com/pop-os/libcosmic.git"
rev = "ef162b8e"
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]

# ---------------------------------------------------------------------------
# Product package: `idle-cosmic`
#
#   sudo dnf install idle-cosmic
#   sudo apt install idle-cosmic
#
# Installs this COSMIC applet and depends on `idlescreen`.
# ---------------------------------------------------------------------------

[package.metadata.cargo-machete]
# libcosmic is imported under its crate name `cosmic`; machete cannot map
# the package→crate rename and reports it as unused. It is used everywhere.
ignored = ["libcosmic"]

[package.metadata.deb]
name = "idle-cosmic"
changelog = "debian/changelog"
copyright = "2026 IdleScreen"
maintainer = "IdleScreen <jerydleuck@gmail.com>"
extended-description = """IdleScreen product for COSMIC Desktop.
Installs the COSMIC panel applet and depends on idlescreen."""
depends = "libc6, idlescreen"
provides = "app-cosmic, idlescreen-applet, trance-applet, idlescreen-cosmic"
replaces = "app-cosmic, idlescreen-applet, trance-applet, idlescreen-cosmic"
conflicts = "app-cosmic (<< 2.1.0), idlescreen-applet (<< 2.1.0), trance-applet (<< 2.0.0)"
enhances = "cosmic-session, cosmic-panel"
section = "utils"
priority = "optional"
maintainer-scripts = "debian"
assets = [
    ["target/release/idlescreen-applet", "usr/bin/idlescreen-applet", "755"],
    ["resources/app.desktop", "usr/share/applications/io.github.idlescreen.CosmicApplet.desktop", "644"],
    ["resources/app.metainfo.xml", "usr/share/metainfo/io.github.idlescreen.CosmicApplet.metainfo.xml", "644"],
    ["resources/io.github.idlescreen.CosmicApplet-symbolic.svg", "usr/share/icons/hicolor/scalable/apps/io.github.idlescreen.CosmicApplet-symbolic.svg", "644"],
    ["resources/io.github.idlescreen.CosmicApplet-symbolic.svg", "usr/share/icons/hicolor/scalable/status/io.github.idlescreen.CosmicApplet-symbolic.svg", "644"],
    ["idlescreen-applet.1", "usr/share/man/man1/idlescreen-applet.1", "644"]
]

[package.metadata.generate-rpm]
name = "idle-cosmic"
release = "1"
arch = "x86_64"
summary = "IdleScreen for COSMIC"
description = "IdleScreen product for COSMIC: panel applet, requires idlescreen."
license = "Apache-2.0"
post_install_script = "rpm/post.sh"
assets = [
    { source = "target/release/idlescreen-applet", dest = "/usr/bin/idlescreen-applet", mode = "755" },
    { source = "resources/app.desktop", dest = "/usr/share/applications/io.github.idlescreen.CosmicApplet.desktop", mode = "644" },
    { source = "resources/app.metainfo.xml", dest = "/usr/share/metainfo/io.github.idlescreen.CosmicApplet.metainfo.xml", mode = "644" },
    { source = "resources/io.github.idlescreen.CosmicApplet-symbolic.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.idlescreen.CosmicApplet-symbolic.svg", mode = "644" },
    { source = "resources/io.github.idlescreen.CosmicApplet-symbolic.svg", dest = "/usr/share/icons/hicolor/scalable/status/io.github.idlescreen.CosmicApplet-symbolic.svg", mode = "644" },
    { source = "idlescreen-applet.1", dest = "/usr/share/man/man1/idlescreen-applet.1", mode = "644" }
]

[package.metadata.generate-rpm.requires]
idlescreen = "*"

[package.metadata.generate-rpm.provides]
app-cosmic = "*"
idlescreen-applet = "*"
trance-applet = "*"
idlescreen-cosmic = "*"

[package.metadata.generate-rpm.obsoletes]
app-cosmic = "*"
idlescreen-applet = "*"
trance-applet = "*"
idlescreen-cosmic = "*"

[package.metadata.generate-rpm.supplements]
cosmic-panel = "*"
cosmic-session = "*"
