[package]
name = "idlescreen"
version = "4.7.0"
edition = "2024"
license = "Apache-2.0"
authors = ["idlescreen developers"]
description = "IdleScreen standalone screensaver and idle management suite for Linux"
repository = "https://github.com/idlescreen/idlescreen"
default-run = "idlescreen"

[[bin]]
name = "idlescreen"
path = "src/main.rs"

[dependencies]
libc = "0.2"
zbus = { version = "5.12", default-features = false, features = ["tokio", "blocking-api"] }
tokio = { version = "1.40", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
ttfx = { git = "https://github.com/omacom-io/ttfx", rev = "921bd551c308c235e01c5867f0199efe0691c271" }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unused_must_use = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
semicolon_if_nothing_returned = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
unused_self = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
match_same_arms = "allow"
return_self_not_must_use = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
similar_names = "allow"
inline_always = "allow"
manual_memcpy = "allow"

[package.metadata.deb]
name = "idlescreen"
maintainer = "IdleScreen <team@idlescreen.org>"
copyright = "2026 IdleScreen"
section = "utils"
priority = "optional"
depends = "libc6"
replaces = "idle-daemon (<< 5.0.0), idle-cli (<< 5.0.0), idle-savers (<< 5.0.0), idle-tui (<< 5.0.0), idle-cosmic (<< 5.0.0), idle-saver-ascii (<< 5.0.0), idle-saver-aurora (<< 5.0.0), idle-saver-beams (<< 5.0.0), idle-saver-bursts (<< 5.0.0), idle-saver-chaos (<< 5.0.0), idle-saver-cosmos (<< 5.0.0), idle-saver-glyphs (<< 5.0.0), idle-saver-gnats (<< 5.0.0), idle-saver-hearth (<< 5.0.0), idle-saver-radar (<< 5.0.0), idle-saver-ripple (<< 5.0.0), idle-saver-storm (<< 5.0.0), idle-runner (<< 5.0.0), idlescreen-extras (<< 5.0.0)"
breaks = "idle-daemon (<< 5.0.0), idle-cli (<< 5.0.0), idle-savers (<< 5.0.0), idle-tui (<< 5.0.0), idle-cosmic (<< 5.0.0), idle-saver-ascii (<< 5.0.0), idle-saver-aurora (<< 5.0.0), idle-saver-beams (<< 5.0.0), idle-saver-bursts (<< 5.0.0), idle-saver-chaos (<< 5.0.0), idle-saver-cosmos (<< 5.0.0), idle-saver-glyphs (<< 5.0.0), idle-saver-gnats (<< 5.0.0), idle-saver-hearth (<< 5.0.0), idle-saver-radar (<< 5.0.0), idle-saver-ripple (<< 5.0.0), idle-saver-storm (<< 5.0.0), idle-runner (<< 5.0.0), idlescreen-extras (<< 5.0.0)"
provides = "idle-daemon (= 4.7.0), idle-cli (= 4.7.0), idle-savers (= 4.7.0), idle-tui (= 4.7.0), idle-saver-ascii (= 4.7.0), idle-saver-aurora (= 4.7.0), idle-saver-beams (= 4.7.0), idle-saver-bursts (= 4.7.0), idle-saver-chaos (= 4.7.0), idle-saver-cosmos (= 4.7.0), idle-saver-glyphs (= 4.7.0), idle-saver-gnats (= 4.7.0), idle-saver-hearth (= 4.7.0), idle-saver-radar (= 4.7.0), idle-saver-ripple (= 4.7.0), idle-saver-storm (= 4.7.0), idle-runner (= 4.7.0), idlescreen-extras (= 4.7.0)"
extended-description = "IdleScreen standalone screensaver and idle management suite for Linux"
maintainer-scripts = "debian"
assets = [
    ["../../target/release/idlescreen", "usr/bin/idlescreen", "755"],
    ["../../assets/idlescreen.service", "usr/lib/systemd/user/idlescreen.service", "644"],
    ["../../assets/idlescreen.desktop", "etc/xdg/autostart/idlescreen.desktop", "644"],
    ["../../assets/idlescreen.1", "usr/share/man/man1/idlescreen.1", "644"],
    ["../../assets/io.github.idlescreen.Idle.service", "usr/share/dbus-1/services/io.github.idlescreen.Idle.service", "644"],
    ["../../target/release/idlescreen", "usr/bin/idle-tui", "755"],
    ["../../target/release/idlescreen", "usr/bin/idle-cli", "755"],
    ["../../target/release/idlescreen", "usr/bin/idle-daemon", "755"],
    ["../../libexec/schedule-remove-stack.sh", "usr/libexec/idlescreen/schedule-remove-stack", "755"],
    ["../../libexec/remove-product-stack.sh", "usr/libexec/idlescreen/remove-product-stack", "755"],
    ["../../assets/services/idlescreen.openrc", "usr/share/idlescreen/services/idlescreen.openrc", "755"],
    ["../../assets/services/idlescreen.runit", "usr/share/idlescreen/services/idlescreen.runit", "755"],
    ["../../assets/services/idlescreen.runit-log", "usr/share/idlescreen/services/idlescreen.runit-log", "755"],
    ["../../assets/services/idlescreen.dinit", "usr/share/idlescreen/services/idlescreen.dinit", "644"],
    ["../../assets/services/idlescreen.s6-run", "usr/share/idlescreen/services/idlescreen.s6-run", "755"],
    ["../../assets/services/idlescreen.s6-type", "usr/share/idlescreen/services/idlescreen.s6-type", "644"],
]

[package.metadata.generate-rpm]
name = "idlescreen"
release = "1"
arch = "x86_64"
summary = "IdleScreen standalone screensaver and idle management suite for Linux"
description = "Pure event-driven idle daemon, CLI, and built-in ASCII screensaver suite"
license = "Apache-2.0"
pre_uninstall_script = "rpm/preun.sh"
post_uninstall_script = "rpm/postun.sh"
assets = [
    { source = "../../target/release/idlescreen", dest = "/usr/bin/idlescreen", mode = "755" },
    { source = "../../assets/idlescreen.service", dest = "/usr/lib/systemd/user/idlescreen.service", mode = "644" },
