name: Probe toolchain auth
on:
  pull_request:
    branches: [ooda]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe dispatch token
        env:
          T: ${{ secrets.IDLESCREEN_PACKAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "RESULT=DISPATCH_TOKEN_UNSET"; exit 0; fi
          if git clone --depth 1 "https://x-access-token:${T}@github.com/openOODA-core/oodac.git" /tmp/tc1 2>/dev/null; then
            echo "RESULT=DISPATCH_TOKEN_WORKS"
          else
            echo "RESULT=DISPATCH_TOKEN_FAILS"
          fi
      - name: Probe default token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/openOODA-core/oodac.git" /tmp/tc2 2>/dev/null; then
            echo "RESULT=DEFAULT_TOKEN_WORKS"
          else
            echo "RESULT=DEFAULT_TOKEN_FAILS"
          fi
