name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must exist)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Skip when the release tag no longer exists
        id: gate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Deleting a release tag fires this workflow's tag trigger, and
          # checking out a tag that is gone fails the job with an error
          # that looks like a broken build. A retracted release is not a
          # broken build: skip it. A dispatch that names a tag which does
          # not exist is an operator error, and still fails.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .ref >/dev/null 2>&1; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "::error::tag ${RELEASE_TAG} does not exist"
            exit 1
          else
            echo "::notice::tag ${RELEASE_TAG} no longer exists - the release was retracted, there is nothing to build"
            echo "build=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.gate.outputs.build == 'yes'
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install the openOODA toolchain
        if: steps.gate.outputs.build == 'yes'
        env:
          # The toolchain repos are private in the openOODA-core org, so the
          # default GITHUB_TOKEN cannot read them. The installer pulls the
          # std tree with the gh CLI, so a PAT with repo scope across that
          # org is required here.
          GH_TOKEN: ${{ secrets.IDLESCREEN_PACKAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::IDLESCREEN_PACKAGES_DISPATCH_TOKEN is not set — cannot install the openOODA toolchain"
            exit 1
          fi
          # The toolchain is a compiler plus a runtime archive, and the
          # compiler needs that archive to link anything — the runtime
          # cannot be rebuilt from source without one. The installer is the
          # supported way to get both: it verifies every asset against the
          # hub's SHA256SUMS before installing it.
          curl -fsSL https://openooda.org/install.sh | bash -s -- --yes
          test -x "$HOME/.openooda/bin/oodac"
          test -f "$HOME/.openooda/bin/liboodar.a"
          echo "OODA_HOME=$HOME/.openooda" >> "$GITHUB_ENV"

      - name: Stage the std tree and the build tree under /tmp
        if: steps.gate.outputs.build == 'yes'
        run: |
          # oodar's oo_child_filter_env() replaces the inherited jail scope of
          # a child process with a hardcoded scope that covers /tmp, so the
          # `oodac check` child that `oodac build` spawns cannot read a
          # workspace outside those roots. /tmp is the one portable root in
          # that list (oodar's fs layer always allows it), so the std tree and
          # the build tree are staged there. The sandbox stays on and no
          # toolchain revision is pinned.
          #
          # The std tree is staged under the name `oostd`, as a sibling of the
          # project: the compiler resolves oostd/... imports through
          # OODA_STD_DIR, and the Makefile points it at that sibling.
          mkdir -p /tmp/ooda-toolchain
          cp -a "$HOME/.openooda/oostd" /tmp/ooda-toolchain/oostd
          mkdir -p /tmp/ooda-toolchain/idlescreen
          rsync -a --exclude .git "$GITHUB_WORKSPACE/" /tmp/ooda-toolchain/idlescreen/
          echo "OODA_STD_DIR=/tmp/ooda-toolchain/oostd" >> "$GITHUB_ENV"
          echo "WORKDIR=/tmp/ooda-toolchain/idlescreen" >> "$GITHUB_ENV"

      - name: Verify, test, parity, det
        if: steps.gate.outputs.build == 'yes'
        working-directory: ${{ env.WORKDIR }}
        run: |
          make verify
          make test
          make parity
          make det

      - name: Collect the release binary
        if: steps.gate.outputs.build == 'yes'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cp /tmp/ooda-toolchain/idlescreen/bin/idlescreen "$GITHUB_WORKSPACE/bin/idlescreen"
          chmod +x "$GITHUB_WORKSPACE/bin/idlescreen"

      - name: Install Cosign
        if: steps.gate.outputs.build == 'yes'
        run: |
          curl -Lo cosign https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/

      - name: Sign release binary with Cosign
        if: steps.gate.outputs.build == 'yes'
        run: |
          sha256sum bin/idlescreen > bin/idlescreen.sha256
          cosign sign-blob --yes --output-signature bin/idlescreen.sig --output-certificate bin/idlescreen.pem bin/idlescreen

      - name: Create Release
        if: steps.gate.outputs.build == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Tag arrives via env, never expression interpolation into shell.
          case "$RELEASE_TAG" in
            ""|*[!A-Za-z0-9._-]*) echo "ERROR: invalid release tag '$RELEASE_TAG'" >&2; exit 1 ;;
          esac
          [ "${#RELEASE_TAG}" -le 64 ] || { echo "ERROR: tag too long" >&2; exit 1; }
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "Release $RELEASE_TAG" \
            bin/idlescreen bin/idlescreen.sha256 bin/idlescreen.sig bin/idlescreen.pem

      - name: Trigger Packages Repository Update
        if: steps.gate.outputs.build == 'yes'
        env:
          GH_TOKEN: ${{ secrets.IDLESCREEN_PACKAGES_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DISPATCH_REPO: ${{ github.repository }}
        run: |
          # Advisory, never fatal. This dispatch is a latency optimisation,
          # not a dependency: packages' import-release.yml runs a "Sweep
          # latest releases" step on a 6-hourly cron that converges the pool
          # to every product repo's latest release whether or not a dispatch
          # ever arrived. A missing or rejected token therefore costs at most
          # one sweep window. Failing here instead would report a release that
          # published correctly as a failed run, which trains readers to
          # ignore red Xs on this workflow. Warn loudly, stay green.
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::IDLESCREEN_PACKAGES_DISPATCH_TOKEN is not set — pool will converge on the next 6-hourly sweep (import-release.yml), not now"
            exit 0
          fi
          # gh -f builds JSON-escaped fields — no raw tag interpolation.
          if ! gh api repos/idlescreen/packages/dispatches \
            -X POST \
            -f event_type=new_release \
            -f "client_payload[repo]=${DISPATCH_REPO}" \
            -f "client_payload[tag]=${RELEASE_TAG}"; then
            echo "::warning::packages dispatch rejected — the 6-hourly sweep in import-release.yml will import ${DISPATCH_REPO} ${RELEASE_TAG} instead"
          fi
