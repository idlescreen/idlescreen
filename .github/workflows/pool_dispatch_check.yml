name: Pool Dispatch Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch the pool import with the release secret
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch
        env:
          GH_TOKEN: ${{ secrets.IDLESCREEN_PACKAGES_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::IDLESCREEN_PACKAGES_DISPATCH_TOKEN is not set"
            exit 1
          fi
          gh api repos/idlescreen/packages/dispatches \
            -X POST \
            -f event_type=new_release \
            -f "client_payload[repo]=idlescreen/idlescreen" \
            -f "client_payload[tag]=v4.8.2"
          echo "DISPATCH_OK"
