name: CI

on:
  push:
    branches: [ooda, master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oo-gates:
    name: openOODA gates (verify, test, parity, det)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch openOODA toolchain (oodac, oodar, std)
        run: |
          mkdir -p "$RUNNER_TEMP/toolchain"
          for r in oodac oodar std; do
            git clone --depth 1 "https://git.clownhouse.io/openOODA-core/$r.git" "$RUNNER_TEMP/toolchain/$r"
          done
          echo "OODA_HOME=$RUNNER_TEMP/toolchain" >> "$GITHUB_ENV"

      - name: Verify (portable, page rule, file law, academy, density, vocab, shape, oodac check)
        run: make verify

      - name: Test suite
        run: make test

      - name: Scene parity
        run: make parity

      - name: Deterministic build
        run: make det
