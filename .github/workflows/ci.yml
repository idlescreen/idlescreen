name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: rustup
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --component rustfmt
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: file length cap (16-256 lines per page)
      # Org-wide rule from .github/RULES.md.
      run: |
        over=$(find . -name '*.rs' -not -path './target/*' \
            | xargs wc -l \
            | awk '$2 != "total" && ($1 > 256 || $1 < 16)')
        if [ -n "$over" ]; then
          echo "Files outside 16-256 line range:"
          echo "$over"
          exit 1
        fi
    - name: every page declares a performance metric
      # Every `.rs` page must carry a `// perf:` line saying what it
      # costs and how a machine would notice if that changed -- `bench`,
      # `test`, or `review`. Pure bash/grep/awk, so it rides along with
      # the checkout rather than costing another job.
      run: bash scripts/check-perf-labels.sh
    - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: rustup
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --component clippy
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    # A deadlocked test must fail the build, not burn a runner for the
    # 6-hour default. See runtime's
    # `apply_commands_drains_channel_until_empty` incident.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: rustup
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - run: cargo test --all-targets

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: rustup
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - run: cargo build --release
